<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BCRedupath — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0; min-height: 100%;
        background: #0a0a1f;
        background-image:
          radial-gradient(ellipse 800px 600px at 0% 0%, rgba(168,85,247,0.18), transparent 60%),
          radial-gradient(ellipse 600px 500px at 100% 100%, rgba(6,214,255,0.14), transparent 60%);
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        display: grid; place-items: center; padding: 2rem;
      }
      .card {
        max-width: 360px; text-align: center;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 1.5rem;
        padding: 2rem;
        backdrop-filter: blur(16px);
      }
      .emoji { font-size: 4rem; margin-bottom: 0.5rem; }
      h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
      p { color: rgba(255,255,255,0.65); margin: 0 0 1.5rem; line-height: 1.5; }
      a {
        display: inline-block;
        background: linear-gradient(135deg, #ff3e88, #a855f7);
        color: #fff; text-decoration: none;
        padding: 0.75rem 1.5rem; border-radius: 1rem;
        font-weight: 600;
        box-shadow: 0 0 30px rgba(255,62,136,0.4);
      }
      .pill {
        display: inline-block; font-size: 0.7rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.15em;
        background: rgba(255,214,10,0.15); color: #ffd60a;
        border: 1px solid rgba(255,214,10,0.4);
        border-radius: 999px; padding: 0.25rem 0.75rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">📡</div>
      <span class="pill">Offline</span>
      <h1>You're offline</h1>
      <p>Bookmarked questions are cached and still readable. Once you reconnect, your XP and streak will sync automatically.</p>
      <a href="/dashboard">Try dashboard</a>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
