<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3e88"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#fff" stroke-width="12" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#fff" stroke-width="14" stroke-opacity="0.55"/>
  <circle cx="256" cy="256" r="40" fill="#ffd60a" filter="url(#glow)"/>
</svg>
